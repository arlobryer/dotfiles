name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck setup.sh macos_defaults.sh

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brew install
        run: |
          # Skip casks and interactive steps in CI
          brew update
          brew install ripgrep bat eza fd fzf python gh jq atuin zoxide
          brew install llm
          brew cleanup
      - name: Apply macOS defaults
        run: bash macos_defaults.sh
